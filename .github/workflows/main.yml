
name: Remote SSH Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          export GIT_TERMINAL_PROMPT=0

          sudo mkdir -p /root/a

          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          sudo git clone https://github.com/beichen23333/BlueArchive-Tools.git /root/a

          sudo git -C /root/a submodule sync --recursive
          sudo git -C /root/a submodule update --init --recursive

          sudo git clone --branch JP --recurse-submodules https://github.com/beichen23333/BA-FlatData.git /root/a/FlatData

          sudo git -C /root/a/FlatData submodule sync --recursive
          sudo git -C /root/a/FlatData submodule update --init --recursive

          sudo chown -R root:root /root/a

          echo "=========================================="
          echo "Clone completed"
          echo "BlueArchive-Tools: /root/a"
          echo "BA-FlatData: /root/a/FlatData"
          echo "Branch: $(sudo git -C /root/a/FlatData branch --show-current)"
          echo "=========================================="

      - name: Setup SSH
        run: |
          set -e

          echo "root:admin" | sudo chpasswd

          sudo sed -i '/^#\?PermitRootLogin /d' /etc/ssh/sshd_config
          sudo sed -i '/^#\?PasswordAuthentication /d' /etc/ssh/sshd_config
          sudo sed -i '/^#\?KbdInteractiveAuthentication /d' /etc/ssh/sshd_config

          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "KbdInteractiveAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "UsePAM yes" | sudo tee -a /etc/ssh/sshd_config

          sudo sshd -t
          sudo service ssh restart

      - name: Run Cloudflared
        run: |
          set -e

          curl -fL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared tunnel --url tcp://localhost:22 > cloudflare.log 2>&1 &

          echo "Waiting for Cloudflare tunnel..."

          for i in {1..30}; do
            DOMAIN=$(grep -oE '[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflare.log | head -n 1 || true)

            if [ -n "$DOMAIN" ]; then
              echo "=========================================="
              echo "SSH Domain: $DOMAIN"
              echo "=========================================="

              echo "$DOMAIN" > cf_domain.txt
              break
            fi

            sleep 2
          done

          if [ ! -f cf_domain.txt ]; then
            echo "Failed to obtain Cloudflare domain"
            cat cloudflare.log
            exit 1
          fi

      - name: Keep Alive
        run: sleep 21600
