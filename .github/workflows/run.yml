name: Bilibili Auto Tools

on:
  workflow_dispatch:
  repository_dispatch:
    types: [Restart]

jobs:
  run-like:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Login
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone Private Repository
        run: |
          git clone git@github.com:beichen23333/BlackList.git bc
          git clone git@github.com:beichen23333/Bilibili-AutoLike.git Bilibili-AutoLike

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r Bilibili-AutoLike/requirements.txt

      - name: Run Like Script
        env:
          BILI_ACCESS_TOKEN: ${{ secrets.BILI_ACCESS_TOKEN }}
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_JCT: ${{ secrets.BILI_JCT }}
        run: |
          python Bilibili-AutoLike/request.py

  run-reply:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Login
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone Private Repository
        run: |
          git clone git@github.com:beichen23333/BlackList.git bc
          git clone git@github.com:beichen23333/Bilibili-AutoLike.git Bilibili-AutoLike

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r Bilibili-AutoLike/requirements.txt

      - name: Run Reply Script
        env:
          BILI_ACCESS_TOKEN: ${{ secrets.BILI_ACCESS_TOKEN }}
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_JCT: ${{ secrets.BILI_JCT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python Bilibili-AutoLike/reply.py

  trigger-restart:
    runs-on: ubuntu-latest
    needs: [run-like, run-reply]
    steps:
      - name: Restart
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.UPDATE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d "{\"event_type\": \"Restart\"}"
